name: Sincronizar aba Propostas

# Pega a versão mais nova do painel Propostas & Retorno (que mora no
# repositório Painel-Propostas-Retorno), cola a barra de abas do Estoque no
# topo e grava aqui como propostas-retorno.html.

on:
  schedule:
    # GitHub Actions usa horário UTC. Brasília = UTC-3.
    # 06:00, 10:00, 14:00 e 18:00 BRT.
    - cron: '0 9,13,17,21 * * *'
  workflow_dispatch:

concurrency:
  group: sincronizar-propostas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Baixar o painel de Propostas e montar a aba
        run: python3 scripts/sincronizar_propostas.py

      - name: Publicar se mudou alguma coisa
        run: |
          if [ -z "$(git status --porcelain propostas-retorno.html)" ]; then
            echo "Nada mudou no painel de Propostas. Nenhum commit."
            exit 0
          fi
          git config user.name  "actions-user"
          git config user.email "actions@github.com"
          git add propostas-retorno.html
          git commit -m "Sincroniza aba Propostas - $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          for tentativa in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push && exit 0
            echo "Push falhou (tentativa $tentativa), tentando de novo..."
            sleep 5
          done
          echo "Não consegui publicar depois de 3 tentativas."
          exit 1
