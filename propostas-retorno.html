<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Propostas &amp; Retorno – Comercial Varejo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface-2:#F5F8F7; --ink:#15201E; --ink-2:#4C5B57; --ink-3:#7A8884;
  --line:#D3DCD9; --line-2:#E5EBE9; --accent:#0D5B79; --accent-hover:#0A4A63; --accent-ink:#FFFFFF; --accent-soft:#DCEBF1;
  --ok:#1F7446; --ok-soft:#DCEFE3; --warn:#94650C; --warn-soft:#F5E8C7; --bad:#AD271F; --bad-soft:#F6DDDA;
  --info:#5B4BA0; --info-soft:#E7E3F5;
  --shadow:0 1px 2px rgba(16,32,30,.06),0 6px 24px -12px rgba(16,32,30,.18);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1514; --surface:#161F1E; --surface-2:#1B2524; --ink:#E3EBE9; --ink-2:#A7B5B1; --ink-3:#7B8985;
    --line:#2A3735; --line-2:#212D2C; --accent:#5DB1D2; --accent-hover:#7CC2DE; --accent-ink:#062230; --accent-soft:#15323D;
    --ok:#6BCB92; --ok-soft:#163325; --warn:#E1B352; --warn-soft:#382C13; --bad:#EF8A80; --bad-soft:#3B1C19;
    --info:#A99BE6; --info-soft:#262040;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1514; --surface:#161F1E; --surface-2:#1B2524; --ink:#E3EBE9; --ink-2:#A7B5B1; --ink-3:#7B8985;
  --line:#2A3735; --line-2:#212D2C; --accent:#5DB1D2; --accent-hover:#7CC2DE; --accent-ink:#062230; --accent-soft:#15323D;
  --ok:#6BCB92; --ok-soft:#163325; --warn:#E1B352; --warn-soft:#382C13; --bad:#EF8A80; --bad-soft:#3B1C19;
  --info:#A99BE6; --info-soft:#262040;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{max-width:1240px;margin:0 auto;padding:18px 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em;margin:0;line-height:1.1}
.brand p{margin:0;color:var(--ink-3);font-size:13px}
.seg-mode{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg-mode button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;font-size:14px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.seg-mode button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;display:inline-grid;place-items:center;font-weight:700}

.app{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:0 40px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:880px){.app{grid-template-columns:minmax(0,1fr)}}

.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:12px}
@media (max-width:880px){.side{position:static}}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.side-head h2{font-family:var(--f-display);font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0;font-weight:600}
.plist{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 300px);overflow:auto;padding:2px}
@media (max-width:880px){.plist{flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px}.pitem{min-width:230px}}
.pitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.pitem:hover{border-color:var(--ink-3)}
.pitem[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.pitem .pn{font-family:var(--f-display);font-weight:700;font-size:17px;min-width:0;overflow-wrap:anywhere;line-height:1.2}
.pitem .pd{grid-column:1/-1;color:var(--ink-3);font-size:12.5px}
.pitem .pv{grid-column:1/-1;color:var(--ink-2);font-size:13px}
.empty-side{border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--ink-3);font-size:13px}
.sidebox{border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--ink-3);display:flex;flex-direction:column;gap:8px}
.sidebox b{color:var(--ink-2)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-aguardando{background:var(--accent-soft);color:var(--accent)}
.st-aprovada,.st-aceita{background:var(--ok-soft);color:var(--ok)}
.st-recusada{background:var(--bad-soft);color:var(--bad)}
.st-contra{background:var(--warn-soft);color:var(--warn)}
.st-info{background:var(--info-soft);color:var(--info)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
/* limpar */
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:disabled{opacity:.5;cursor:not-allowed}
.btn.small{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.phead{padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-start;justify-content:space-between}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.phead h2{font-family:var(--f-display);font-weight:700;font-size:30px;margin:2px 0 0;line-height:1.05;display:flex;align-items:center;gap:12px;flex-wrap:wrap;text-wrap:balance;overflow-wrap:anywhere}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sec{border-top:1px solid var(--line-2);padding:14px 20px}
.sec h3{font-family:var(--f-display);font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;font-weight:600}
.note{padding:12px 20px;border-top:1px solid var(--line-2);color:var(--ink-2);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.note b{color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid .full{grid-column:1/-1}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:64px}
.field .hint{font-size:12px;color:var(--ink-3)}
.field .err{font-size:12px;color:var(--bad);font-weight:600}
.field.bad input,.field.bad textarea{border-color:var(--bad)}
.affix{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);overflow:hidden}
.affix:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.affix input{border:0!important;background:transparent!important;outline:none;font-variant-numeric:tabular-nums}
.affix span{padding:0 10px;color:var(--ink-3);font-size:13px;font-weight:600}
.field.bad .affix{border-color:var(--bad)}

dl.data{margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px}
@media (max-width:640px){dl.data{grid-template-columns:repeat(2,minmax(0,1fr))}}
dl.data div{min-width:0}
dl.data dt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
dl.data dd{margin:2px 0 0;font-weight:600;font-size:16px;overflow-wrap:anywhere}
dl.data dd small{display:block;font-weight:500;font-size:12.5px;color:var(--ink-3)}
dd.big{font-family:var(--f-display);font-size:22px!important;line-height:1.15}
.mono{font-family:var(--f-mono);font-size:14px!important;font-weight:500!important}

.tl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line-2);padding:12px 20px;gap:10px}
@media (max-width:560px){.tl{grid-template-columns:minmax(0,1fr)}}
.tl-s{display:grid;grid-template-columns:12px 1fr;gap:1px 8px;align-items:center;align-content:start;min-width:0}
.tl-d{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--surface);grid-row:1}
.tl-s.done .tl-d{background:var(--ok);border-color:var(--ok)}
.tl-s.wait .tl-d{border-color:var(--warn);background:var(--warn-soft)}
.tl-l{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tl-t{grid-column:2;font-weight:600;font-size:14px}
.tl-x{grid-column:2;font-size:12.5px;color:var(--ink-2)}
.tl-s.wait .tl-x{color:var(--warn);font-weight:600}

.verdict{margin:0 20px 16px;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.verdict.aprovada,.verdict.aceita{background:var(--ok-soft)}
.verdict.recusada{background:var(--bad-soft)}
.verdict.contra{background:var(--warn-soft)}
.verdict.info{background:var(--info-soft)}
.verdict .vt{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.1}
.verdict.aprovada .vt,.verdict.aceita .vt{color:var(--ok)}
.verdict.recusada .vt{color:var(--bad)}
.verdict.contra .vt{color:var(--warn)}
.verdict.info .vt{color:var(--info)}
.verdict .vc{white-space:pre-wrap;overflow-wrap:anywhere}
.verdict .vm{font-size:13px;color:var(--ink-2)}
.verdict .vx{display:flex;gap:18px;flex-wrap:wrap}
.verdict .vx div{display:flex;flex-direction:column}
.verdict .vx span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.verdict .vx b{font-family:var(--f-display);font-size:20px}

.dec{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
@media (max-width:640px){.dec{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dec button{border:0;border-right:1px solid var(--line);background:transparent;padding:11px 6px;font-size:14px;font-weight:600;color:var(--ink-2)}
.dec button:last-child{border-right:0}
@media (max-width:640px){.dec button:nth-child(2){border-right:0}.dec button:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.dec button[aria-pressed="true"][data-d="aprovada"]{background:var(--ok);color:#fff}
.dec button[aria-pressed="true"][data-d="recusada"]{background:var(--bad);color:#fff}
.dec button[aria-pressed="true"][data-d="contra"]{background:var(--warn);color:#fff}
.dec button[aria-pressed="true"][data-d="info"]{background:var(--info);color:#fff}
:root[data-theme="dark"] .dec button[aria-pressed="true"]{color:#101615}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dec button[aria-pressed="true"]{color:#101615}}
.rpanel{display:flex;flex-direction:column;gap:12px}

.prev{display:flex;flex-direction:column;gap:8px}
.prev div{font-size:13.5px;color:var(--ink-2);border-left:3px solid var(--line);padding:2px 0 2px 10px;overflow-wrap:anywhere}
.prev b{color:var(--ink)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 180px;min-width:0;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px 8px 32px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);font-weight:500;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px}

.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line-2)}
@media (max-width:640px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
.summary > div{padding:12px 20px;border-right:1px solid var(--line-2)}
.summary > div:last-child{border-right:0}
.summary .k{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.03em}
.summary .v{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.15}
.summary .v small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--ink-3)}

.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.hist{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:860px}
table.hist th,table.hist td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle;text-align:left}
table.hist thead th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;white-space:nowrap}
table.hist td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.hist th.n{text-align:right}
table.hist td:first-child,table.hist th:first-child{padding-left:20px}
table.hist tr.hrow{cursor:pointer}
table.hist tr.hrow:hover td{background:var(--surface-2)}
.sub2{display:block;font-size:12px;color:var(--ink-3)}

.foot{position:sticky;bottom:0;z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
.foot .card{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:12px 16px 12px 20px}
.foot .grow{flex:1}
.foot .hint{font-size:13px;color:var(--ink-3)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.empty h3{font-family:var(--f-display);color:var(--ink);font-size:20px;margin:0 0 6px}
.banner{padding:12px 16px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.lock{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:500;font-size:14px;z-index:20;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.copybox{padding:12px 20px;border-top:1px solid var(--line-2)}
.copybox textarea{width:100%;min-height:140px;font-family:var(--f-mono);font-size:12.5px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ihead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ihead .hint{font-size:12px;color:var(--ink-3)}
.icols,.irow{display:grid;grid-template-columns:minmax(0,1fr) 130px 170px 110px 34px;gap:8px 10px;align-items:start}
.icols{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:0 0 6px}
.icols .r,.itot{text-align:right}
.irow{padding:7px 0;border-top:1px solid var(--line-2)}
.itot{padding-top:9px;font-weight:600}
.irm{font-size:18px;line-height:1;padding:6px 8px}
.iadd{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:10px}
.iadd .hint{font-size:12px;color:var(--ink-3)}
@media (max-width:680px){.icols{display:none}.irow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px;grid-template-areas:"p p x" "q v v" "t t t"}.irow .ip{grid-area:p}.irow .iq{grid-area:q}.irow .iv{grid-area:v}.irow .itot{grid-area:t;padding-top:0}.irow .irm{grid-area:x}}
.affix input{width:100%;min-width:0;padding:8px 10px}
.foot .stat{display:flex;flex-direction:column}
.foot .stat .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.foot .stat .v{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1}
table.itab{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;min-width:520px}
table.itab th,table.itab td{padding:8px 10px;border-bottom:1px solid var(--line-2);text-align:left}
table.itab th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
table.itab .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.itab tfoot td{font-weight:700;border-bottom:0}
table.itab td.c{color:var(--warn);font-weight:700}
table.itab th:first-child,table.itab td:first-child{padding-left:0}
.clist{display:flex;flex-direction:column;gap:8px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-2)}
@media (max-width:560px){.crow{grid-template-columns:minmax(0,1fr)}}
.cn{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.ctot{font-family:var(--f-display);font-size:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.auth{max-width:460px;margin:24px auto 48px;padding-inline:16px}
.auth .card{padding:24px;display:flex;flex-direction:column;gap:14px}
.auth h2{font-family:var(--f-display);font-weight:700;font-size:28px;margin:2px 0 4px;line-height:1.1}
.auth p{margin:0;color:var(--ink-2)}
.muted{color:var(--ink-3)!important;font-size:14px}
.msbtn{display:flex;gap:10px;align-items:center;justify-content:center;padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;color:var(--ink)}
.msbtn:hover{border-color:var(--ink-3)}
.msbtn[disabled]{opacity:.6}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.aform{display:flex;flex-direction:column;gap:12px}
.errmsg{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:8px;font-weight:500;font-size:14px}
.okmsg{background:var(--ok-soft);color:var(--ok);padding:10px 12px;border-radius:8px;font-weight:500;font-size:14px}
.userbox{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.userbox b{color:var(--ink);font-weight:600}

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

const DEC={aprovada:'Aprovada',recusada:'Recusada',contra:'Contraproposta',info:'Pedir mais informações'};
const ST={aguardando:'Aguardando retorno',aprovada:'Aprovada',recusada:'Recusada',contra:'Contraproposta',aceita:'Contraproposta aceita',info:'Faltam informações'};
const S={auth:null,db:null,user:null,uid:null,admin:false,mode:'solicitar',L:{},cfg:{supervisores:[]},loaded:false,unsub:[],
  sel:null,filtro:'aguardando',q:'',form:null,formErr:{},editId:null,rd:null,rdErr:null,respEdit:false,copy:null,busy:false,
  seen:null,seenR:null,som:false,notif:false,audio:null,supTxt:null,authTab:'entrar',authMsg:null,authErr:null,authBusy:false};

/* ---------- utils ---------- */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmt=(n,d=2)=>(Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:d});
function parseNum(v){if(v==null) return null;let s=String(v).trim().replace(/[R$\s%]/g,'');if(!s) return null;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const n=parseFloat(s);return isFinite(n)?n:null;}
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const fDT=iso=>{if(!iso) return '—';const d=new Date(iso);return isNaN(d)?'—':d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});};
function fDur(ms){if(ms==null||!isFinite(ms)||ms<0) return '—';const m=Math.round(ms/60000);if(m<60) return m+' min';const h=Math.floor(m/60),mm=m%60;if(h<24) return h+'h'+(mm?' '+String(mm).padStart(2,'0')+'min':'');const d=Math.floor(h/24),hh=h%24;return d+'d'+(hh?' '+hh+'h':'');}
const digits=s=>String(s||'').replace(/\D/g,'');
function fmtDoc(s){const d=digits(s);if(d.length===11) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');if(d.length===14) return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');return s||'';}
function cpfOk(d){if(d.length!==11||/^(\d)\1+$/.test(d)) return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++) s+=+d[i]*(t+1-i);if(((s*10)%11)%10!==+d[t]) return false;}return true;}
function cnpjOk(d){if(d.length!==14||/^(\d)\1+$/.test(d)) return false;const w=[6,5,4,3,2,9,8,7,6,5,4,3,2];for(const t of [12,13]){let s=0;for(let i=0;i<t;i++) s+=+d[i]*w[i+(13-t)];const r=s%11<2?0:11-s%11;if(r!==+d[t]) return false;}return true;}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3600);}
function handleErr(e){console.warn(e);const c=e&&e.code;
  if(c==='permission-denied') toast('Sem permissão para isso. Confira se você entrou com o e-mail certo.');
  else if(c==='unavailable') toast('Sem conexão. Tente de novo em instantes.');
  else toast('Não foi possível salvar agora. Tente de novo em instantes.');}
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function recall(k){try{return localStorage.getItem(k)}catch(e){return null}}
function beep(){if(!S.som) return;try{const a=S.audio||(S.audio=new (window.AudioContext||window.webkitAudioContext)());const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.2,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.35);o.start();o.stop(a.currentTime+.4);}catch(e){}}
function desk(title,body){if(!S.notif||!('Notification' in window)||Notification.permission!=='granted') return;try{new Notification(title,{body});}catch(e){}}

/* ---------- data ---------- */
const pkg=v=>brl(v)+'/kg';
const itens=x=>Array.isArray(x.itens)?x.itens:[];
function tot(x){let kg=0,rs=0;const its=itens(x);for(const i of its){const q=Number(i.qtd)||0;kg+=q;rs+=q*(Number(i.valor)||0);}return {n:its.length,kg,rs,med:kg?rs/kg:0};}
function cprice(r,k,i){return r&&r.cvi&&r.cvi[k]!=null?r.cvi[k]:i.valor;}
function totContra(x,r){let rs=0;itens(x).forEach((i,k)=>{rs+=(Number(i.qtd)||0)*(Number(cprice(r,k,i))||0);});return rs;}
const nItens=n=>n+(n===1?' item':' itens');
const dec2=v=>v==null||v===''?'':String(v).replace('.',',');
const get=id=>S.L[id]||null;
const cur=x=>x&&x.resposta&&(x.resposta.versao||1)>=(x.versao||1)?x.resposta:null;
function status(x){if(!x) return 'aguardando';const r=cur(x);if(!r) return 'aguardando';
  if(r.dec==='contra'&&x.aceite&&x.aceite.versao===x.versao) return 'aceita';return r.dec;}
function list(onlyMine){return Object.entries(S.L).filter(([,x])=>!onlyMine||x.uid===S.uid).map(([id,x])=>({id,x,st:status(x)}));}
function minhas(){return list(true).filter(i=>!i.x.oculta);}
const domingoSP=()=>new Date(Date.now()-3*36e5).getUTCDay()===0;
function nextNum(){let m=0;for(const i of list(true)) m=Math.max(m,i.x.n||0);return m+1;}
const vend=x=>x.vendedorNome||x.vendedorEmail||'Vendedor';
const isRep=x=>!String(x.vendedorEmail||'').toLowerCase().endsWith('@'+CONFIG.dominio);
const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
const meuNome=()=>(S.user&&(S.user.displayName||S.user.email))||'Você';

/* ---------- writes ---------- */
const blankItem=()=>({produto:'',qtd:'',valor:''});
const itemEmpty=it=>!String(it.produto||'').trim()&&!String(it.qtd||'').trim()&&!String(it.valor||'').trim();
function blankForm(){return {nome:recall('nome')||(S.user&&S.user.displayName)||'',cliente:'',cod:'',doc:'',supervisor:recall('sup')||'',itens:[blankItem()],desc:'',obs:''};}
function validate(f){const e={};
  if(!f.nome.trim()) e.nome='Informe o seu nome.';
  if(!f.cliente.trim()) e.cliente='Informe o cliente.';
  const d=digits(f.doc); if(d&&(d.length===11?!cpfOk(d):d.length===14?!cnpjOk(d):true)) e.doc='CNPJ ou CPF inválido. Confira os dígitos ou deixe em branco.';
  let any=false;
  f.itens.forEach((it,k)=>{if(itemEmpty(it)) return;any=true;
    if(!it.produto.trim()) e['i'+k+'produto']='Informe o produto.';
    const q=parseNum(it.qtd); if(!q||q<=0) e['i'+k+'qtd']='Informe os kg.';
    const v=parseNum(it.valor); if(!v||v<=0) e['i'+k+'valor']='Informe o R$/kg.';});
  if(!any) e.i0produto='Adicione pelo menos um item.';
  const ds=f.desc===''?0:parseNum(f.desc); if(ds==null||ds<0||ds>100) e.desc='Desconto entre 0 e 100%.';
  if(S.cfg.supervisores.length&&!f.supervisor) e.supervisor='Escolha seu supervisor.';
  return e;}
function formBody(f){return {vendedorNome:f.nome.trim(),cliente:f.cliente.trim(),cod:String(f.cod||'').trim().slice(0,40),doc:digits(f.doc),supervisor:f.supervisor||'',
  itens:f.itens.filter(it=>!itemEmpty(it)).map(it=>({produto:it.produto.trim(),qtd:Math.round(parseNum(it.qtd)*1000)/1000,valor:Math.round(parseNum(it.valor)*100)/100})),
  desc:f.desc===''?0:parseNum(f.desc),obs:f.obs.trim()};}
async function enviar(){
  const f=S.form; const e=validate(f); S.formErr=e; if(Object.keys(e).length){render();toast('Confira os campos marcados.');return;}
  if(S.busy) return; S.busy=true; render();
  const now=new Date().toISOString(); const b=formBody(f); store('sup',b.supervisor); store('nome',b.vendedorNome);
  try{
    if(S.editId){
      const x=get(S.editId);
      await updateDoc(doc(S.db,'propostas',S.editId),{...b,versao:(x.versao||1)+1,enviadaEm:now,envios:[...(x.envios||[x.enviadaEm]),now],aceite:null});
      S.sel=S.editId; toast('Nova versão enviada para os aprovadores.');
    }else{
      const ref=await addDoc(collection(S.db,'propostas'),{...b,uid:S.uid,vendedorEmail:(S.user.email||'').toLowerCase(),n:nextNum(),versao:1,criadaEm:now,enviadaEm:now,envios:[now],aceite:null});
      S.sel=ref.id; toast('Proposta enviada. Você recebe o retorno aqui.');
    }
    S.form=null; S.editId=null; S.formErr={}; store('sel',S.sel);
  }catch(err){handleErr(err);}
  S.busy=false; render(true);
}
async function aceitar(id){const x=get(id);if(!x||S.busy) return;S.busy=true;render();
  try{await updateDoc(doc(S.db,'propostas',id),{aceite:{versao:x.versao,em:new Date().toISOString()}});toast('Contraproposta aceita.');}catch(e){handleErr(e);}
  S.busy=false;render();}
async function responder(){
  const id=S.sel; const x=get(id); const rd=S.rd; if(!x||!rd) return;
  if(!rd.dec){S.rdErr='Escolha um retorno.';render();return;}
  if(rd.dec!=='aprovada'&&!rd.com.trim()){S.rdErr=rd.dec==='recusada'?'Explique o motivo da recusa.':rd.dec==='info'?'Diga o que falta na proposta.':'Explique a contraproposta.';render();return;}
  let cvi=null,cd=null;
  if(rd.dec==='contra'){cvi=itens(x).map((i,k)=>{const v=parseNum(rd.cvi[k]);return v&&v>0?Math.round(v*100)/100:null;});
    if(rd.cvi.some((s,k)=>String(s||'').trim()&&cvi[k]==null)){S.rdErr='Confira os preços da contraproposta.';render();return;}
    cd=rd.cd===''?null:parseNum(rd.cd);
    if(cd!=null&&(cd<0||cd>100)){S.rdErr='Desconto entre 0 e 100%.';render();return;}
    if(cvi.every(v=>v==null)&&cd==null){S.rdErr='Informe um novo preço por kg em pelo menos um item, ou um desconto.';render();return;}}
  if(S.busy) return; S.busy=true; S.rdErr=null; render();
  const now=new Date().toISOString(); const prev=x.resposta;
  const anteriores=prev?[...(x.anteriores||[]),prev]:(x.anteriores||[]);
  const resposta={dec:rd.dec,com:rd.com.trim(),cvi,cd,por:S.uid,porNome:meuNome(),em:now,versao:x.versao||1};
  try{await updateDoc(doc(S.db,'propostas',id),{resposta,anteriores});S.rd=null;S.respEdit=false;toast('Retorno enviado para '+vend(x)+'.');}
  catch(e){handleErr(e);}
  S.busy=false; render();
}
async function limparMinhas(){
  const alvo=minhas().filter(i=>i.st!=='aguardando'); if(!alvo.length||S.busy) return;
  if(!confirm('Limpar '+alvo.length+(alvo.length===1?' proposta respondida':' propostas respondidas')+' da sua lista?\n\nAs que ainda aguardam retorno continuam aparecendo.')) return;
  S.busy=true; render();
  try{for(let k=0;k<alvo.length;k+=400){const b=writeBatch(S.db);alvo.slice(k,k+400).forEach(i=>b.update(doc(S.db,'propostas',i.id),{oculta:true}));await b.commit();}
    if(alvo.some(i=>i.id===S.sel)) S.sel=null; toast('Sua lista foi limpa.');}
  catch(e){handleErr(e);}
  S.busy=false; render();
}
async function limparTodas(){
  const ids=Object.keys(S.L); if(!ids.length||S.busy) return;
  if(!domingoSP()){toast('A limpeza geral só pode ser feita no domingo.');return;}
  const r=prompt('Isso EXCLUI DE VEZ '+ids.length+' propostas de todos os vendedores e representantes. Não dá para desfazer.\n\nSe já baixou a planilha e quer continuar, digite LIMPAR:');
  if(r==null) return; if(r.trim().toUpperCase()!=='LIMPAR'){toast('Limpeza cancelada.');return;}
  S.busy=true; render();
  try{for(let k=0;k<ids.length;k+=400){const b=writeBatch(S.db);ids.slice(k,k+400).forEach(id=>b.delete(doc(S.db,'propostas',id)));await b.commit();}
    S.sel='__hist'; toast('Propostas excluídas.');}
  catch(e){handleErr(e);}
  S.busy=false; render();
}
async function saveSup(txt){const arr=[...new Set(txt.split(/[,;\n]/).map(s=>s.trim()).filter(Boolean))];
  try{await setDoc(doc(S.db,'config','geral'),{supervisores:arr},{merge:true});S.supTxt=null;toast('Lista de supervisores salva.');}catch(e){handleErr(e);}}

/* ---------- login ---------- */
const noDominio=e=>String(e||'').toLowerCase().endsWith('@'+CONFIG.dominio);
function authErrMsg(e){const c=(e&&e.code)||'';
  if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')) return 'E-mail ou senha incorretos.';
  if(c.includes('email-already-in-use')) return 'Este e-mail já tem acesso. Use “Entrar” ou “Esqueci a senha”.';
  if(c.includes('weak-password')) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(c.includes('too-many-requests')) return 'Muitas tentativas. Aguarde alguns minutos.';
  if(c.includes('popup-closed')) return 'A janela de login foi fechada antes de terminar.';
  if(c.includes('unauthorized-domain')) return 'Este endereço do site não está autorizado no Firebase (veja o LEIA-ME, passo 2).';
  if(c.includes('account-exists-with-different-credential')) return 'Este e-mail já tem acesso com senha. Entre com e-mail e senha.';
  if(c.includes('operation-not-allowed')) return 'Este tipo de login não está ativado no Firebase.';
  return 'Não foi possível entrar. '+(e&&e.message?e.message:'');}
async function entrarMicrosoft(){
  S.authErr=null;S.authBusy=true;renderAuth();
  const p=new OAuthProvider('microsoft.com');
  p.setCustomParameters({tenant:CONFIG.microsoft.tenant,prompt:'select_account'});
  try{await signInWithPopup(S.auth,p);}
  catch(e){if(e&&e.code==='auth/popup-blocked'){await signInWithRedirect(S.auth,p);return;}S.authErr=authErrMsg(e);}
  S.authBusy=false;renderAuth();
}
async function entrarEmail(){
  const em=$('#a-email').value.trim().toLowerCase(),pw=$('#a-senha')?$('#a-senha').value:'';
  S.authErr=null;S.authMsg=null;
  if(!emailOk(em)){S.authErr='Digite um e-mail válido.';renderAuth();return;}
  S.authBusy=true;renderAuth();
  try{
    if(S.authTab==='entrar') await signInWithEmailAndPassword(S.auth,em,pw);
    else if(S.authTab==='criar'){
      const nm=($('#a-nome')?$('#a-nome').value:'').trim(); if(!nm){S.authErr='Informe seu nome.';S.authBusy=false;renderAuth();return;}
      const c=await createUserWithEmailAndPassword(S.auth,em,pw); await updateProfile(c.user,{displayName:nm}); await sendEmailVerification(c.user);
    }else{await sendPasswordResetEmail(S.auth,em);S.authMsg='Enviamos um link para '+em+'. Abra o e-mail e crie a nova senha.';S.authTab='entrar';}
  }catch(e){S.authErr=authErrMsg(e);}
  S.authBusy=false;renderAuth();
}
function renderAuth(){
  const keep={};['a-nome','a-email','a-senha'].forEach(id=>{const el=document.getElementById(id);if(el) keep[id]=el.value;});
  _renderAuth();
  Object.keys(keep).forEach(id=>{const el=document.getElementById(id);if(el&&keep[id]) el.value=keep[id];});
}
function _renderAuth(){
  const a=$('#auth'); $('.app').hidden=true; a.hidden=false; $('#userbox').hidden=true; $('#modeSeg').hidden=true;

function docHint(v){const d=digits(v);if(!d) return 'Pode deixar em branco';if(d.length===11) return cpfOk(d)?'CPF '+fmtDoc(d)+' ✓':'CPF com dígito inválido';if(d.length===14) return cnpjOk(d)?'CNPJ '+fmtDoc(d)+' ✓':'CNPJ com dígito inválido';return d.length+' dígitos · CPF tem 11, CNPJ tem 14';}

function timeline(x){

}

function summaryText(x){const r=cur(x),st=status(x),t=tot(x);const contra=r&&r.dec==='contra';
  return [`Proposta ${x.n} — ${x.cliente}`,`Vendedor: ${vend(x)}${isRep(x)?' (representante)':''}${x.supervisor?' · Supervisor: '+x.supervisor:''}`,x.cod?`Código do cliente: ${x.cod}`:'',x.doc?`CNPJ/CPF: ${fmtDoc(x.doc)}`:'',
    ...itens(x).map((i,k)=>`• ${i.produto}: ${fmt(i.qtd)} kg × ${pkg(i.valor)} = ${brl(i.qtd*i.valor)}${contra&&r.cvi&&r.cvi[k]!=null?` → contra ${pkg(r.cvi[k])}`:''}`),

function renderDetail(m,id,adm){
  const x=get(id); const st=status(x); const c=cur(x);
  let h=`<section class="card"><div class="phead"><div><div class="eyebrow num">${adm?esc(vend(x))+(isRep(x)?' · representante':'')+' · ':''}Proposta ${x.n}${(x.versao||1)>1?' · versão '+x.versao:''}</div><h2>${esc(x.cliente)} <span class="pill st-${st}">${esc(ST[st])}</span></h2></div>

async function liberar(){

}

function exportCsv(){
  const q=v=>{const s=String(v??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const d=v=>v==null?'':String(Math.round(v*1000)/1000).replace('.',',');
  const lines=[['Proposta','Versão','Vendedor','E-mail','Supervisor','Cliente','Código do cliente','CNPJ/CPF','Enviada','Status','Produto','Kg','Preço (R$/kg)','Total do item (R$)','Contraproposta (R$/kg)','Total da proposta (R$)','Desconto pedido (%)','Desconto liberado (%)','Retorno','Comentário','Respondido por','Tempo de retorno (h)']];
  for(const r of histRows()){const t=tot(r.x);const contra=r.r&&r.r.dec==='contra';
    itens(r.x).forEach((i,k)=>lines.push([r.x.n,r.x.versao||1,vend(r.x),r.x.vendedorEmail||'',r.x.supervisor||'',r.x.cliente,r.x.cod||'',fmtDoc(r.x.doc),fDT(r.x.enviadaEm),ST[r.st],i.produto,d(i.qtd),d(i.valor),d(Math.round(i.qtd*i.valor*100)/100),contra&&r.r.cvi&&r.r.cvi[k]!=null?d(r.r.cvi[k]):'',d(Math.round(t.rs*100)/100),d(r.x.desc||0),r.r&&r.r.cd!=null?d(r.r.cd):'',r.r?fDT(r.r.em):'',r.r?r.r.com:'',r.r?r.r.porNome||'':'',r.t!=null?d(Math.round(r.t/36e5*100)/100):'']));}
  const blob=new Blob(['﻿'+lines.map(l=>l.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Propostas.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

document.addEventListener('change',async ev=>{
  const el=ev.target;
  if(el.id==='som'){S.som=el.checked;store('som',S.som?'1':'0');if(S.som){beep();toast('Som ativado.');}return;}
  if(el.id==='notif'){if(el.checked){const p=await Notification.requestPermission();S.notif=p==='granted';if(!S.notif){el.checked=false;toast('O navegador bloqueou os avisos. Libere nas configurações do site.');}}else S.notif=false;store('notif',S.notif?'1':'0');return;}
  if(el.tagName==='SELECT'&&el.dataset.f&&S.form){S.form[el.dataset.f]=el.value;if(S.formErr[el.dataset.f]){delete S.formErr[el.dataset.f];render();}}
});

/* ---------- avisos ---------- */
function notifyAdmin(){
  const now=new Set(list(false).filter(i=>i.st==='aguardando').map(i=>i.id+'@'+(i.x.versao||1)));
  if(S.seen){const fresh=[...now].filter(k=>!S.seen.has(k));if(fresh.length){const x=get(fresh[0].split('@')[0]);const msg=fresh.length>1?fresh.length+' novas propostas chegaram.':'Nova proposta de '+vend(x)+' · '+x.cliente;toast(msg);beep();desk('Propostas & Retorno',msg);}}
  S.seen=now;
}
function notifyVendor(){
  const now=new Set(list(true).filter(i=>cur(i.x)).map(i=>i.id+'@'+cur(i.x).em));
  if(S.seenR){const fresh=[...now].filter(k=>!S.seenR.has(k));if(fresh.length){const x=get(fresh[0].split('@')[0]);const msg='Retorno chegou para '+x.cliente+': '+ST[status(x)];toast(msg);beep();desk('Propostas & Retorno',msg);}}
  S.seenR=now;
}

/* ---------- início ---------- */
function stop(){S.unsub.forEach(f=>{try{f()}catch(e){}});S.unsub=[];S.acessos=[];S.L={};S.loaded=false;S.seen=null;S.seenR=null;S.admin=false;S.sel=null;S.form=null;S.rd=null;}
async function start(){
  stop(); const u=S.user; S.uid=u.uid;
  $('.app').hidden=true; $('#auth').hidden=false; $('#auth').innerHTML='<div class="card empty"><h3>Carregando propostas…</h3></div>';
  if(!noDominio(u.email)){let ok=false;try{const a=await getDoc(doc(S.db,'acessos',u.email.toLowerCase()));ok=a.exists()&&a.data().ativo===true;}catch(e){ok=false;}
    if(!ok){S.semAcesso=true;renderAuth();return;}}
  S.semAcesso=false;
  try{await getDocs(query(collection(S.db,'propostas'),limit(1)));S.admin=true;}catch(e){S.admin=false;}
  S.mode=S.admin&&recall('mode')!=='solicitar'?'responder':'solicitar';
  if(!S.admin){const saved=recall('sel');if(saved) S.sel=saved;}
  const onErr=e=>{console.warn(e);toast(e&&e.code==='permission-denied'?'Sem permissão para ler as propostas.':'Conexão instável. Recarregue a página se nada atualizar.');};
  S.unsub.push(onSnapshot(doc(S.db,'config','geral'),s=>{const d=s.exists()?s.data():{};S.cfg={supervisores:Array.isArray(d.supervisores)?d.supervisores:[]};render();},()=>{}));
  if(S.admin) S.unsub.push(onSnapshot(query(collection(S.db,'acessos')),s=>{const A=[];s.forEach(d=>A.push({id:d.id,...d.data()}));S.acessos=A;render();},()=>{}));
  const q=S.admin?query(collection(S.db,'propostas'),orderBy('enviadaEm','desc'),limit(1000)):query(collection(S.db,'propostas'),where('uid','==',S.uid));
  S.unsub.push(onSnapshot(q,s=>{const L={};s.forEach(d=>{L[d.id]=d.data();});S.L=L;S.loaded=true;if(S.admin) notifyAdmin();notifyVendor();render();},onErr));
  setTimeout(()=>{if(!S.loaded){S.loaded=true;render();}},6000);
}
function boot(){
  S.som=recall('som')==='1'; S.notif=recall('notif')==='1'&&'Notification' in window&&Notification.permission==='granted';
  if(CONFIG.firebase.apiKey==='COLE_AQUI'){renderAuth();return;}
  const app=initializeApp(CONFIG.firebase); S.auth=getAuth(app); S.db=getFirestore(app);
  getRedirectResult(S.auth).catch(e=>{S.authErr=authErrMsg(e);renderAuth();});
  onAuthStateChanged(S.auth,u=>{S.user=u;
    S.semAcesso=false;
    const ok=u&&u.email&&(u.emailVerified||!u.providerData.some(p=>p.providerId==='password'));
    if(ok) start(); else {stop();renderAuth();}
  });
  setInterval(()=>{if(S.user&&S.loaded&&!document.hidden&&!S.form&&!S.rd) renderSide();},60000);
}
boot();

</script>
</body>
