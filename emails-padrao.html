<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<title>E-mails Padrão · Canção Alimentos</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#8f0e28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estoque Apuc">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { overscroll-behavior-y: contain; overflow-x: hidden; }
  body { overflow-x: hidden; }

  :root {
    --ink: #1c1611;
    --ink-soft: #56493e;
    --paper: #f1ebdf;
    --surface: #fffdfa;
    --surface-raised: #ffffff;
    --line: #e3d8c6;
    --line-soft: #ece3d3;
    --brand: #8f0e28;
    --brand-dark: #59091b;
    --brand-glow: #c1354e;
    --gold: #9c6c0d;
    --gold-soft: #f8ecd3;
    --muted: #92836f;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', monospace;
    --display: 'Bricolage Grotesque', 'Segoe UI', sans-serif;
    --body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --shadow-sm: 0 1px 2px rgba(28,22,17,.07), 0 1px 1px rgba(28,22,17,.05);
    --shadow-md: 0 6px 18px rgba(28,22,17,.10), 0 1px 4px rgba(28,22,17,.06);
    --shadow-lg: 0 14px 34px rgba(28,22,17,.16), 0 3px 10px rgba(28,22,17,.09);
    --shadow-xl: 0 24px 60px rgba(28,22,17,.20), 0 6px 16px rgba(28,22,17,.10);
  }

  html[data-theme="dark"] {
    --ink: #f1ebe0;
    --ink-soft: #cabfae;
    --paper: #161210;
    --surface: #1e1a16;
    --surface-raised: #26211c;
    --line: #3a332b;
    --line-soft: #2d2822;
    --brand: #c1354e;
    --brand-dark: #8f0e28;
    --brand-glow: #e3536a;
    --gold: #d9a344;
    --gold-soft: #3a2f1a;
    --muted: #8f8477;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3), 0 1px 1px rgba(0,0,0,.2);
    --shadow-md: 0 6px 18px rgba(0,0,0,.35), 0 1px 4px rgba(0,0,0,.25);
    --shadow-lg: 0 14px 34px rgba(0,0,0,.45), 0 3px 10px rgba(0,0,0,.3);
    --shadow-xl: 0 24px 60px rgba(0,0,0,.55), 0 6px 16px rgba(0,0,0,.35);
  }

  html[data-theme="dark"] body {
    background-image:
      radial-gradient(ellipse 900px 500px at 100% -5%, rgba(193,53,78,.08), transparent 55%),
      radial-gradient(ellipse 800px 500px at -10% 105%, rgba(217,163,68,.06), transparent 50%);
  }

  body {
    font-family: var(--body);
    background: var(--paper);
    background-image:
      radial-gradient(ellipse 900px 500px at 100% -5%, rgba(143,14,40,.06), transparent 55%),
      radial-gradient(ellipse 800px 500px at -10% 105%, rgba(156,108,13,.07), transparent 50%);
    background-attachment: fixed;
    color: var(--ink);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .theme-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 10px;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.3);
    color: #fff; font-size: 15px; cursor: pointer;
    margin-left: 8px;
  }
  .theme-toggle:active { transform: scale(.94); }

  .page-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .page-tab {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 13px;
    border-radius: 20px;
    font-family: var(--body);
    font-size: 12px; font-weight: 600;
    text-decoration: none;
    color: rgba(255,255,255,.75);
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.2);
    transition: background .15s;
  }
  .page-tab.active { background: #fff; color: var(--brand-dark); border-color: #fff; }
  .page-tab:not(.active):active { background: rgba(255,255,255,.22); }

  header {
    background:
      radial-gradient(ellipse at 18% -40%, rgba(255,255,255,.16), transparent 55%),
      linear-gradient(155deg, var(--brand) 0%, var(--brand-dark) 100%);
    color: #fff;
    padding: calc(22px + env(safe-area-inset-top, 0px)) 18px 34px;
    position: relative;
    z-index: 10;
    box-shadow: var(--shadow-lg);
  }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
  }
  .header-text { min-width: 0; overflow: hidden; }
  header h1 {
    font-family: var(--display);
    font-size: 20px; font-weight: 700; letter-spacing: .1px;
  }
  header p {
    font-size: 11px; opacity: .8; margin-top: 3px;
    letter-spacing: .3px;
  }
  .header-right { display: flex; align-items: center; flex-shrink: 0; }

  .content-wrap {
    max-width: 900px;
    margin: -14px auto 40px;
    padding: 0 16px;
    position: relative;
    z-index: 5;
  }

  .section-label {
    font-family: var(--display);
    font-size: 13px; font-weight: 700;
    color: var(--muted);
    text-transform: uppercase; letter-spacing: .6px;
    margin: 22px 2px 10px;
  }

  .templates-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr));
    gap: 12px;
  }

  .template-card {
    background: var(--surface-raised);
    border: 1px solid var(--line-soft);
    border-radius: 16px;
    padding: 16px;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: var(--ink);
    transition: box-shadow .15s, transform .1s, border-color .15s;
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
  }
  .template-card:hover { box-shadow: var(--shadow-md); border-color: var(--brand-glow); }
  .template-card:active { transform: scale(.98); }
  .template-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 11px;
    background: var(--gold-soft); color: var(--gold);
    font-size: 18px; margin-bottom: 10px;
  }
  .template-card h3 {
    font-family: var(--display);
    font-size: 15px; font-weight: 700; margin-bottom: 4px;
  }
  .template-card p {
    font-size: 12px; color: var(--muted); line-height: 1.4;
  }
  .template-dest {
    margin-top: 10px; font-size: 10.5px; color: var(--muted);
    font-family: var(--mono);
    overflow-wrap: break-word; word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .empty-note {
    background: var(--surface-raised);
    border: 1px dashed var(--line);
    border-radius: 14px;
    padding: 22px;
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 10px;
  }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(20,15,10,.55);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 900;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.show { display: flex; }
  @media (min-width: 620px) {
    .modal-overlay { align-items: center; }
  }
  .modal {
    background: var(--surface-raised);
    width: 100%;
    max-width: 540px;
    max-height: 92vh;
    overflow-y: auto;
    border-radius: 20px 20px 0 0;
    box-shadow: var(--shadow-xl);
    padding: 20px;
  }
  @media (min-width: 620px) {
    .modal { border-radius: 20px; }
  }
  .modal-hdr {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 10px; margin-bottom: 14px;
  }
  .modal-hdr h2 {
    font-family: var(--display);
    font-size: 17px; font-weight: 700;
  }
  .modal-hdr .modal-sub {
    font-size: 11.5px; color: var(--muted); margin-top: 3px;
  }
  .modal-close {
    background: var(--line-soft); border: 0; border-radius: 9px;
    width: 30px; height: 30px; font-size: 15px; color: var(--ink);
    cursor: pointer; flex-shrink: 0;
  }
  .modal-dest-box {
    background: var(--gold-soft); border-radius: 11px; padding: 9px 12px;
    font-size: 11px; color: var(--ink-soft); margin-bottom: 16px; line-height: 1.5;
  }
  .modal-dest-box b { color: var(--ink); }
  .field { margin-bottom: 13px; }
  .field label {
    display: block; font-size: 12px; font-weight: 700;
    color: var(--ink-soft); margin-bottom: 5px;
  }
  .field .hint {
    font-size: 10.5px; color: var(--muted); font-weight: 400;
    margin-left: 4px;
  }
  .field input, .field textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); font: inherit; font-size: 16px;
    outline: none; resize: vertical;
    -webkit-appearance: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--brand-glow); }
  .field textarea { min-height: 70px; }

  /* ---- Bonificação ---- */
  .bn-sec { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted,#888); margin:16px 0 8px; }
  .bn-row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:520px){ .bn-row2{ grid-template-columns:1fr; } }
  .bn-item { border:1px solid var(--line-soft); border-radius:12px; padding:10px; margin-bottom:8px; position:relative; }
  .bn-item-hdr { display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:700; margin-bottom:6px; }
  .bn-item-hdr button { background:none; border:0; color:#d33; font-size:13px; cursor:pointer; }
  .bn-item-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .bn-item-grid .full { grid-column:1 / -1; }
  .bn-linha { font-size:12.5px; opacity:.85; }
  .bn-item input { width:100%; box-sizing:border-box; padding:9px 11px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:16px; outline:none; -webkit-appearance:none; }
  .bn-item input:focus { border-color:var(--brand-glow); }
  .bn-add { width:100%; margin:2px 0 10px; }
  .bn-total { display:flex; justify-content:space-between; font-weight:700; padding:12px; border-radius:12px; background:var(--line-soft); font-size:15px; }
  .bn-total small { font-weight:500; opacity:.75; display:block; font-size:11px; }
  .bn-result { margin-top:14px; padding:12px; border-radius:12px; border:1px solid var(--line-soft); font-size:13px; line-height:1.5; }
  .bn-result .btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .bn-result .btn { flex:1 1 45%; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
  .btn {
    flex: 1; padding: 12px; border-radius: 12px; border: 0;
    font: inherit; font-size: 13.5px; font-weight: 700;
    cursor: pointer;
  }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:active { background: var(--brand-dark); }
  .btn-secondary { background: var(--line-soft); color: var(--ink); flex: 0 0 auto; padding: 12px 16px; }

  /* ── COMPACTO EM TELAS ESTREITAS ── */
  @media (max-width: 480px) {
    header { padding: calc(16px + env(safe-area-inset-top, 0px)) 12px 26px; }
    .page-tabs { margin-bottom: 8px; }
    .page-tab { padding: 6px 10px; font-size: 11px; }
    header h1 { font-size: 17px; }
    header p { font-size: 10px; }
    .theme-toggle { width: 28px; height: 28px; font-size: 13px; }
    .content-wrap { margin-top: -10px; padding: 0 12px; }
    .section-label { font-size: 12px; margin: 18px 2px 8px; }
    .templates-grid { grid-template-columns: 1fr; gap: 10px; }
    .template-card { padding: 14px; }
    .modal { padding: 16px; max-height: 88vh; }
    .modal-hdr h2 { font-size: 15.5px; }
    .modal-actions { flex-direction: column-reverse; }
    .btn-secondary { width: 100%; }
  }
</style>
</head>
<script>
(function() {
  var saved = localStorage.getItem('estoque-theme');
  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<body>

<header>
  <div class="page-tabs">
    <a href="./index.html" class="page-tab">📦 Estoque</a>
    <a href="./tabela-precos.html" class="page-tab">💰 Preços</a>
    <a href="./pedidos-em-aberto.html" class="page-tab">📋 Pedidos</a>
    <a href="./propostas-retorno.html" class="page-tab">🤝 Propostas</a>
    <a href="./acompanhamento-vendedores.html" class="page-tab">📈 Vendedores</a>
    <a href="./emails-padrao.html" class="page-tab active">📧 Emails</a>
    <a href="./ociosidade-frete.html" class="page-tab">🚚 Ociosidade/Frete</a>
  </div>
  <div class="header-top">
    <div class="header-text">
      <h1>E-mails Padrão</h1>
      <p>Modelos prontos · escolha, preencha e envie</p>
    </div>
    <div class="header-right">
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Alternar tema">🌙</button>
    </div>
  </div>
</header>

<div class="content-wrap">
  <div class="section-label">Modelos disponíveis</div>
  <div class="templates-grid" id="templatesGrid"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-hdr">
      <div>
        <h2 id="modalTitle"></h2>
        <div class="modal-sub" id="modalSub"></div>
      </div>
      <button class="modal-close" onclick="fecharModal()">✕</button>
    </div>
    <div class="modal-dest-box">
      <b>Para:</b> <span id="modalDest"></span>
      <div id="modalCcNota" style="margin-top:6px;display:none">⚠️ <b>Sempre coloque seu supervisor em cópia</b> - preencha o e-mail dele no campo abaixo.</div>
      <div id="modalAvisos"></div>
    </div>
    <form id="modalForm"></form>
  </div>
</div>

<script>
// ────────────────────────────────────────────────────────────────
// Modelos de e-mail padrão. Pra adicionar um novo, é só incluir um
// objeto aqui - o formulário e o botão de gerar e-mail são montados
// sozinhos a partir dos "fields".
// ────────────────────────────────────────────────────────────────
var TEMPLATES = [
  {
    id: 'prioridade-cadastro',
    icon: '⚡',
    titulo: 'Prioridade de Cadastro',
    descricao: 'Solicitar prioridade no cadastro de um cliente.',
    destinatarios: [
      'central.cadastro@gtf.com.br',
      'fiscal.matriz@gtf.com.br',
      'AnalisedeCreditoGTF@gtf.com.br',
      'comercial.varejo@gtf.com.br'
    ],
    fields: [
      { key: 'razaoSocial', label: 'Razão Social', type: 'text', placeholder: 'Ex: Comercial Varejo Apucarana LTDA', required: true },
      { key: 'cnpj', label: 'CNPJ', type: 'text', placeholder: '00.000.000/0000-00', required: true },
      { key: 'supervisorEmail', label: 'E-mail do supervisor', hint: '(sempre vai em cópia)', type: 'email', placeholder: 'supervisor@gtf.com.br', required: true },
      { key: 'observacao', label: 'Observação', type: 'textarea', placeholder: 'Alguma informação extra sobre o cadastro (opcional)', required: false }
    ],
    // "cc" é opcional por modelo - quando existe, esses endereços entram
    // em cópia no e-mail (aqui é sempre o supervisor informado no campo acima).
    cc: function(v) {
      return [v.supervisorEmail];
    },
    assunto: function(v) {
      return 'Prioridade de Cadastro - Cliente ' + v.razaoSocial + ' - ' + v.cnpj;
    },
    corpo: function(v) {
      return saudacao() + '\n\n' +
        'Solicito prioridade no cadastro dos clientes abaixo.\n\n' +
        'Razão Social: ' + v.razaoSocial + '\n' +
        'Cnpj: ' + v.cnpj + '\n\n' +
        'Observação:\n' + (v.observacao || '');
    }
  },
  {
    id: 'solicitacao-bonificacao',
    icon: '🎁',
    titulo: 'Solicitação de Bonificação',
    descricao: 'Preencha os itens e o motivo: o PDF é gerado e o e-mail abre pronto para enviar.',
    destinatarios: ['comercial.varejo@gtf.com.br'],
    custom: 'bonificacao',
    avisos: [],
    fields: [],
    cc: function(v) { return [v.supervisorEmail]; },
    assunto: function(v) { return 'Solicitação de Bonificação - ' + v.razaoSocial + ' - ' + v.codigo; },
    corpo: function(v) { return ''; }
  },
  {
    id: 'cadastro-forma-pagamento',
    icon: '💳',
    titulo: 'Cadastro de Forma de Pagamento / Análise de Crédito',
    descricao: 'Solicitar análise de crédito e cadastro da forma de pagamento de um cliente.',
    destinatarios: [
      'AnalisedeCreditoGTF@gtf.com.br',
      'comercial.varejo@gtf.com.br'
    ],
    avisos: [
      '📎 Se tiver, anexe a foto da fachada do estabelecimento (opcional).'
    ],
    fields: [
      { key: 'razaoSocial', label: 'Razão Social', type: 'text', placeholder: 'Ex: Comercial Varejo Apucarana LTDA', required: true },
      { key: 'codigo', label: 'Código do cliente', type: 'text', placeholder: 'Código do cliente', required: true },
      { key: 'limiteSugerido', label: 'Limite sugerido', type: 'text', placeholder: 'Ex: R$ 5.000,00', required: true },
      { key: 'formaPagamentoSugerido', label: 'Forma de pagamento sugerido', type: 'text', placeholder: 'Ex: Boleto 28 dias', required: true },
      { key: 'observacao', label: 'Observação', type: 'textarea', placeholder: 'Alguma informação extra (opcional)', required: false },
      { key: 'supervisorEmail', label: 'E-mail do supervisor', hint: '(sempre vai em cópia)', type: 'email', placeholder: 'supervisor@gtf.com.br', required: true }
    ],
    cc: function(v) {
      return [v.supervisorEmail];
    },
    assunto: function(v) {
      return 'Cadastro de forma de pagamento / Analise de crédito. - ' + v.razaoSocial + ' - ' + v.codigo;
    },
    corpo: function(v) {
      return saudacao() + '\n\n' +
        'Solicito a análise do cliente abaixo e o cadastro da forma de pagamento e limite de crédito.\n\n' +
        'Razão social: ' + v.razaoSocial + '\n' +
        'Código do cliente: ' + v.codigo + '\n' +
        'Limite sugerido: ' + v.limiteSugerido + '\n' +
        'Forma de pagamento sugerido: ' + v.formaPagamentoSugerido + '\n' +
        'Foto da fachada do estabelecimento: (opcional, ver anexo)\n\n' +
        'Observação:\n' + (v.observacao || '');
    }
  },
  {
    id: 'baixa-titulo',
    icon: '🧾',
    titulo: 'Baixa de Título',
    descricao: 'Solicitar a baixa de um título/NF de um cliente.',
    destinatarios: [
      'contas.receber@gtf.com.br',
      'comercial.varejo@gtf.com.br'
    ],
    avisos: [
      '📎 Se tiver, anexe a foto do comprovante de pagamento (opcional).'
    ],
    fields: [
      { key: 'razaoSocial', label: 'Razão Social', type: 'text', placeholder: 'Ex: Comercial Varejo Apucarana LTDA', required: true },
      { key: 'codigo', label: 'Código do cliente', type: 'text', placeholder: 'Código do cliente', required: true },
      { key: 'nf', label: 'NF', type: 'text', placeholder: 'Número da nota fiscal', required: true },
      { key: 'observacao', label: 'Observação', type: 'textarea', placeholder: 'Alguma informação extra (opcional)', required: false },
      { key: 'supervisorEmail', label: 'E-mail do supervisor', hint: '(sempre vai em cópia)', type: 'email', placeholder: 'supervisor@gtf.com.br', required: true }
    ],
    cc: function(v) {
      return [v.supervisorEmail];
    },
    assunto: function(v) {
      return 'Baixa de Titulo: - ' + v.razaoSocial + ' - ' + v.codigo;
    },
    corpo: function(v) {
      return saudacao() + '\n\n' +
        'Solicito a baixa do titulo abaixo:\n\n' +
        'Razão social: ' + v.razaoSocial + '\n' +
        'Código do cliente: ' + v.codigo + '\n' +
        'NF: ' + v.nf + '\n' +
        'Foto do comprovante de pagamento: (opcional, ver anexo)\n\n' +
        'Observação:\n' + (v.observacao || '');
    }
  },
  {
    id: 'troca-produto-reclamacao',
    icon: '🔄',
    titulo: 'Troca de Produto / Reclamação de Cliente',
    descricao: 'Registrar uma reclamação/troca de produto de um cliente (anexar as fotos pedidas).',
    destinatarios: [
      'sac@cancaoalimentos.com.br',
      'comercial.varejo@gtf.com.br'

function saudacao() {
  var h = new Date().getHours();
  if (h < 12) return 'Bom dia';
  if (h < 18) return 'Boa tarde';
  return 'Boa noite';
}

function abrirModal(template) {
  document.getElementById('modalTitle').textContent = template.icon + ' ' + template.titulo;
  document.getElementById('modalSub').textContent = template.descricao;
  document.getElementById('modalDest').textContent = template.destinatarios.join(', ');
  document.getElementById('modalCcNota').style.display = template.cc ? 'block' : 'none';
  var avisosEl = document.getElementById('modalAvisos');
  avisosEl.innerHTML = '';
  (template.avisos || []).forEach(function(txt) {
    var linha = document.createElement('div');
    linha.style.marginTop = '6px';
    linha.textContent = txt;
    avisosEl.appendChild(linha);
  });

  var form = document.getElementById('modalForm');
  form.innerHTML = '';
  if (template.custom === 'bonificacao') {
    abrirModalBonificacao(template);
    document.getElementById('modalOverlay').classList.add('show');
    return;
  }
  template.fields.forEach(function(f) {
    var wrap = document.createElement('div');
    wrap.className = 'field';
    var label = document.createElement('label');
    label.textContent = f.label + (f.required ? '' : ' (opcional)');
    if (f.hint) {
      var hint = document.createElement('span');
      hint.className = 'hint';
      hint.textContent = f.hint;
      label.appendChild(hint);
    }
    wrap.appendChild(label);
    var input;
    if (f.type === 'textarea') {
      input = document.createElement('textarea');
    } else {
      input = document.createElement('input');
      // Respeita o tipo declarado no modelo (email/tel/number/date...), pra o
      // celular já abrir o teclado certo (com @ pra e-mail, numérico pra
      // telefone) e o navegador conferir o formato antes de gerar o e-mail.
      input.type = f.type || 'text';
      if (f.type === 'email') {
        input.autocapitalize = 'none';
        input.autocomplete = 'email';
        input.spellcheck = false;
      }
    }
    input.id = 'campo_' + f.key;
    input.placeholder = f.placeholder || '';
    if (f.required) input.required = true;
    wrap.appendChild(input);
    form.appendChild(wrap);
  });

  var actions = document.createElement('div');
  actions.className = 'modal-actions';
  actions.innerHTML =
    '<button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>' +
    '<button type="submit" class="btn btn-primary">✉️ Gerar e-mail</button>';
  form.appendChild(actions);

  form.onsubmit = function(ev) {
    ev.preventDefault();
    var valores = {};
    var faltando = [];
    template.fields.forEach(function(f) {
      var el = document.getElementById('campo_' + f.key);
      valores[f.key] = el.value.trim();
      if (f.required && !valores[f.key]) faltando.push(f.label);
    });
    if (faltando.length) {
      window.alert('Preencha antes de gerar o e-mail: ' + faltando.join(', '));
      return;
    }
    var to = template.destinatarios.join(',');
    var assunto = template.assunto(valores);
    var corpo = template.corpo(valores);
    var mailto = 'mailto:' + to +
      '?subject=' + encodeURIComponent(assunto) +
      '&body=' + encodeURIComponent(corpo);
    if (template.cc) {
      var cc = template.cc(valores).filter(Boolean);
      if (cc.length) mailto += '&cc=' + encodeURIComponent(cc.join(','));
    }
    window.location.href = mailto;
  };

  document.getElementById('modalOverlay').classList.add('show');
}

function brl(n) { return 'R$ ' + (Number(n) || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function numBR(txt) {
  var t = String(txt || '').trim().replace(/[R$\s]/g, '');
  if (!t) return 0;
  if (t.indexOf(',') > -1) t = t.replace(/\./g, '').replace(',', '.');
  var n = parseFloat(t);
  return isNaN(n) ? 0 : n;
}
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ---- Gerador de PDF mínimo (sem biblioteca, funciona offline) ---- */
var HW = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
function baseChar(c) {
  var n = c.normalize ? c.normalize('NFD').replace(/[̀-ͯ]/g, '') : c;
  return n.charAt(0) || c;
}
function larg(txt, size, bold) {
  var w = 0;
  for (var i = 0; i < txt.length; i++) {
    var code = baseChar(txt.charAt(i)).charCodeAt(0);
    w += (code >= 32 && code <= 126) ? HW[code - 32] : 556;
  }
  return w * size / 1000 * (bold ? 1.07 : 1);
}
function quebrar(txt, maxW, size) {
  var saida = [];
  String(txt).split(/\r?\n/).forEach(function(par) {
    var palavras = par.split(/\s+/), linha = '';
    palavras.forEach(function(p) {
      while (larg(p, size) > maxW) { // palavra gigante
        var k = p.length;
        while (k > 1 && larg(p.slice(0, k), size) > maxW) k--;
        if (linha) { saida.push(linha); linha = ''; }
        saida.push(p.slice(0, k)); p = p.slice(k);
      }
      var teste = linha ? linha + ' ' + p : p;
      if (larg(teste, size) <= maxW) linha = teste; else { if (linha) saida.push(linha); linha = p; }
    });
    saida.push(linha);
  });
  return saida;
}
function pdfStr(t) { // WinAnsi: Latin-1 cobre acentos do português
  var o = '';
  for (var i = 0; i < t.length; i++) {
    var c = t.charCodeAt(i);
    if (c > 255) c = 63;
    if (c === 40 || c === 41 || c === 92) o += '\\' + String.fromCharCode(c);
    else o += String.fromCharCode(c);
  }
  return o;
}
function gerarPdfBonificacao(d) {
  var W = 595, H = 842, M = 40, paginas = [], ops, y;
  function nova() { ops = []; paginas.push(ops); y = H - M; }
  function txt(x, yy, t, size, bold, cor) {
    ops.push((cor || '0 g') + ' BT /' + (bold ? 'F2' : 'F1') + ' ' + size + ' Tf ' + x.toFixed(1) + ' ' + yy.toFixed(1) + ' Td (' + pdfStr(t) + ') Tj ET');
  }
  function txtDir(xdir, yy, t, size, bold) { txt(xdir - larg(t, size, bold), yy, t, size, bold); }
  function linha(x1, yy, x2, cor) { ops.push((cor || '0.7 G') + ' 0.6 w ' + x1 + ' ' + yy.toFixed(1) + ' m ' + x2 + ' ' + yy.toFixed(1) + ' l S'); }
  function garantir(h) { if (y - h < M + 20) nova(); }
  function campo(rot, val) {
    var ls = quebrar(val || '-', W - 2 * M - 110, 10);
    garantir(ls.length * 13 + 4);
    txt(M, y, rot, 10, true);
    ls.forEach(function(l, i) { txt(M + 110, y - i * 13, l, 10, false); });
    y -= ls.length * 13 + 4;
  }
  nova();
  ops.push('0.11 0.45 0.25 rg ' + M + ' ' + (y - 34) + ' ' + (W - 2 * M) + ' 40 re f');
  txt(M + 12, y - 20, 'SOLICITAÇÃO DE BONIFICAÇÃO', 16, true, '1 g');
  txtDir(W - M - 12, y - 20, d.data, 10, false);
  ops[ops.length - 1] = ops[ops.length - 1].replace('0 g', '1 g');
  y -= 58;
  txt(M, y, 'DADOS DO PEDIDO', 10, true, '0.11 0.45 0.25 rg'); y -= 6; linha(M, y, W - M); y -= 16;
  campo('Cliente:', d.razaoSocial + (d.codigo ? '  (cód. ' + d.codigo + ')' : ''));
  campo('Vendedor:', d.vendedor);
  campo('Supervisor:', d.supervisorNome);
  campo('Gestor:', d.gestor);
  campo('Autorizado por:', d.autorizado);
  y -= 8;
  txt(M, y, 'ITENS', 10, true, '0.11 0.45 0.25 rg'); y -= 6; linha(M, y, W - M); y -= 14;
  var cx = { n: M, cod: M + 28, nome: M + 128, qtd: W - M - 215, kg: W - M - 150, pk: W - M - 85, val: W - M };
  function cab() {
    txt(cx.n, y, '#', 9, true); txt(cx.cod, y, 'CÓDIGO', 9, true); txt(cx.nome, y, 'PRODUTO', 9, true);
    txtDir(cx.qtd, y, 'CAIXAS', 9, true); txtDir(cx.kg, y, 'KG TOTAL', 9, true); txtDir(cx.pk, y, 'R$/KG', 9, true); txtDir(cx.val, y, 'VALOR', 9, true);
    y -= 5; linha(M, y, W - M, '0.3 G'); y -= 13;
  }
  cab();
  var totCx = 0, totVl = 0, totKg = 0;
  d.itens.forEach(function(it, i) {
    var nomeW = cx.qtd - 45 - cx.nome;
    var nl = quebrar(it.nome || '-', nomeW, 9.5);
    if (y - nl.length * 12 < M + 60) { nova(); cab(); }
    txt(cx.n, y, String(i + 1), 9.5, false);
    txt(cx.cod, y, it.codigo || '-', 8.5, false);
    nl.forEach(function(l, k) { txt(cx.nome, y - k * 12, l, 9.5, false); });
    txtDir(cx.qtd, y, String(it.qtd).replace('.', ','), 9.5, false);
    txtDir(cx.kg, y, String(it.pesoTotal).replace('.', ','), 9.5, false);
    txtDir(cx.pk, y, brl(it.preco), 9.5, false);
    txtDir(cx.val, y, brl(it.valor), 9.5, false);
    y -= nl.length * 12 + 3; linha(M, y + 7, W - M, '0.88 G'); y -= 4;
    totCx += it.qtd; totVl += it.valor; totKg += it.pesoTotal;
  });
  garantir(40);
  y -= 4; linha(M, y + 8, W - M, '0.3 G');
  txt(cx.nome, y - 6, 'TOTAL', 11, true);
  txtDir(cx.qtd, y - 6, String(totCx).replace('.', ',') + ' cx', 10, true);
  txtDir(cx.kg, y - 6, (Math.round(totKg * 100) / 100).toString().replace('.', ',') + ' kg', 10, true);
  txtDir(cx.val, y - 6, brl(totVl), 11, true);
  y -= 34;
  garantir(40);
  txt(M, y, 'MOTIVO DA BONIFICAÇÃO', 10, true, '0.11 0.45 0.25 rg'); y -= 6; linha(M, y, W - M); y -= 15;
  quebrar(d.motivo, W - 2 * M, 10).forEach(function(l) { garantir(14); txt(M, y, l, 10, false); y -= 13; });
  y -= 18; garantir(70);
  txt(M, y, 'APROVAÇÃO DO SUPERVISOR', 10, true, '0.11 0.45 0.25 rg'); y -= 6; linha(M, y, W - M); y -= 34;
  linha(M, y, M + 230, '0 G'); linha(M + 270, y, M + 360, '0 G');
  txt(M, y - 12, 'Supervisor: ' + (d.supervisorNome || ''), 9, false); txt(M + 270, y - 12, 'Data', 9, false);

  // monta o arquivo
  var objs = [];
  function add(c) { objs.push(c); return objs.length; }
  add('<< /Type /Catalog /Pages 2 0 R >>');
  add('PLACEHOLDER'); // 2: Pages
  var f1 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  var f2 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  var kids = [];
  paginas.forEach(function(o, idx) {
    o.push('0.5 g BT /F1 8 Tf ' + M + ' 24 Td (' + pdfStr('Gerado pelo painel Estoque Apucarana - pág. ' + (idx + 1) + '/' + paginas.length) + ') Tj ET');
    var cont = o.join('\n');
    var c = add('<< /Length ' + cont.length + ' >>\nstream\n' + cont + '\nendstream');
    var pg = add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + W + ' ' + H + '] /Resources << /Font << /F1 ' + f1 + ' 0 R /F2 ' + f2 + ' 0 R >> >> /Contents ' + c + ' 0 R >>');
    kids.push(pg + ' 0 R');
  });
  objs[1] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + kids.length + ' >>';
  var out = '%PDF-1.4\n', offs = [];
  objs.forEach(function(c, i) { offs.push(out.length); out += (i + 1) + ' 0 obj\n' + c + '\nendobj\n'; });
  var xref = out.length;
  out += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n';
  offs.forEach(function(o) { out += ('0000000000' + o).slice(-10) + ' 00000 n \n'; });
  out += 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF';
  var bytes = new Uint8Array(out.length);
  for (var i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 255;
  return new Blob([bytes], { type: 'application/pdf' });
}

    '<div class="bn-row2">' + campoHtml('bn_razao', 'Razão Social', 'Nome do cliente') + campoHtml('bn_codigo', 'Código do cliente', 'Ex: 012345') + '</div>' +
    '<div class="bn-sec">Quem está envolvido</div>' +
    '<div class="bn-row2">' + campoHtml('bn_vendedor', 'Vendedor', 'Seu nome') + campoHtml('bn_gestor', 'Gestor', 'Nome do gestor') + '</div>' +
    '<div class="bn-row2">' + campoHtml('bn_sup', 'Supervisor', 'Nome do supervisor') +
      campoHtml('bn_supmail', 'E-mail do supervisor <span class="hint">(vai em cópia)</span>', 'supervisor@gtf.com.br', 'type="email" autocapitalize="none"') + '</div>' +
    campoHtml('bn_aut', 'Autorizado por', 'Quem autorizou a bonificação') +
    '<div class="bn-sec">Itens</div><div id="bn_itens"></div>' +
    '<button type="button" class="btn btn-secondary bn-add" id="bn_add">➕ Adicionar item</button>' +
    '<div class="bn-total"><div>TOTAL<small id="bn_totcx">0 caixas</small></div><div id="bn_totval">R$ 0,00</div></div>' +
    '<div class="bn-sec">Motivo</div>' +
    '<div class="field"><label>Motivo da bonificação <span class="hint">(quanto mais detalhes, melhor)</span></label>' +
    '<textarea id="bn_motivo" style="min-height:110px" placeholder="Conte o que aconteceu: cliente, situação, histórico de compras, negociação, por que a bonificação é necessária, prazo…"></textarea></div>' +
    '<div class="modal-actions"><button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>' +
    '<button type="submit" class="btn btn-primary">📄 Gerar PDF e e-mail</button></div>' +
    '<div id="bn_result"></div>';

  var itensEl = document.getElementById('bn_itens');
  function recalc() {
    var cx = 0, vl = 0;
    itensEl.querySelectorAll('.bn-item').forEach(function(r, i) {
      r.querySelector('.n').textContent = i + 1;
      var q = numBR(r.querySelector('.q').value), kg = numBR(r.querySelector('.kg').value), pk = numBR(r.querySelector('.pk').value);
      var lt = q * kg * pk;
      r.querySelector('.lt').textContent = brl(lt);
      r.querySelector('.lk').textContent = (q && kg) ? '(' + (Math.round(q * kg * 100) / 100).toString().replace('.', ',') + ' kg)' : '';
      cx += q; vl += lt;
    });
    document.getElementById('bn_totcx').textContent = String(cx).replace('.', ',') + (cx === 1 ? ' caixa' : ' caixas');
    document.getElementById('bn_totval').textContent = brl(vl);
  }
  function addItem() {
    var r = document.createElement('div');
    r.className = 'bn-item';
    r.innerHTML = '<div class="bn-item-hdr"><span>Item <span class="n"></span></span><button type="button" class="rm">✕ remover</button></div>' +
      '<div class="bn-item-grid"><input class="c" placeholder="Código do produto"><input class="q" inputmode="decimal" placeholder="Qtd. em caixas">' +
      '<input class="nm full" placeholder="Nome do produto"><input class="kg" inputmode="decimal" placeholder="Peso da caixa (kg)"><input class="pk" inputmode="decimal" placeholder="Preço por kg (R$)">' +
      '<div class="full bn-linha">Total do item: <b class="lt">R$ 0,00</b> <span class="lk"></span></div></div>';
    r.querySelector('.rm').onclick = function() { if (itensEl.children.length > 1) { r.remove(); recalc(); } };
    r.querySelectorAll('input').forEach(function(i) { i.addEventListener('input', recalc); });
    itensEl.appendChild(r); recalc();
    return r;
  }
  document.getElementById('bn_add').onclick = function() { addItem().querySelector('.c').focus(); };
  addItem();

  function coletar() {
    var g = function(id) { return document.getElementById(id).value.trim(); };
    var itens = [];
    itensEl.querySelectorAll('.bn-item').forEach(function(r) {
      var it = { codigo: r.querySelector('.c').value.trim(), nome: r.querySelector('.nm').value.trim(), qtd: numBR(r.querySelector('.q').value), kg: numBR(r.querySelector('.kg').value), preco: numBR(r.querySelector('.pk').value) };
      it.pesoTotal = Math.round(it.qtd * it.kg * 100) / 100;
      it.valor = Math.round(it.pesoTotal * it.preco * 100) / 100;
      if (it.codigo || it.nome || it.qtd || it.kg || it.preco) itens.push(it);
    });
    var d = new Date();
    return { razaoSocial: g('bn_razao'), codigo: g('bn_codigo'), vendedor: g('bn_vendedor'), gestor: g('bn_gestor'),
      supervisorNome: g('bn_sup'), supervisorEmail: g('bn_supmail'), autorizado: g('bn_aut'),
      motivo: g('bn_motivo'), itens: itens,
      data: ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear() };
  }
  function resumoTexto(d) {
    var cx = 0, vl = 0;
    var linhas = d.itens.map(function(it, i) { cx += it.qtd; vl += it.valor;
      return (i + 1) + ') ' + (it.codigo || '-') + ' - ' + (it.nome || '-') + ' | ' + String(it.qtd).replace('.', ',') + ' cx x ' + String(it.kg).replace('.', ',') + ' kg = ' + String(it.pesoTotal).replace('.', ',') + ' kg | ' + brl(it.preco) + '/kg | ' + brl(it.valor); });
    return { linhas: linhas.join('\n'), cx: cx, vl: vl };
  }
  function nomeArquivo(d) {
    return ('Bonificacao_' + (d.razaoSocial || 'cliente') + '_' + (d.codigo || '')).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9_-]+/g, '_').replace(/_+$/,'') + '.pdf';
  }
  function baixar(blob, nome) {
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = nome; document.body.appendChild(a); a.click();
    setTimeout(function() { a.remove(); URL.revokeObjectURL(url); }, 4000);
  }
  function mailtoDe(d) {
    var r = resumoTexto(d);
    var corpo = saudacao() + '\n\nSolicito bonificação para o cliente ' + d.razaoSocial + ' (cód. ' + d.codigo + ').\n\n' +
      'Vendedor: ' + d.vendedor + '\nSupervisor: ' + d.supervisorNome + '\nGestor: ' + d.gestor + '\nAutorizado por: ' + d.autorizado + '\n\n' +
      'Itens:\n' + r.linhas + '\n\nTOTAL: ' + String(r.cx).replace('.', ',') + ' caixas | ' + brl(r.vl) + '\n\n' +
      'Motivo:\n' + d.motivo + '\n\n📎 PDF da solicitação em anexo.\n\n' +
      'Supervisor ' + d.supervisorNome + ', poderia dar o OK respondendo este e-mail, por favor.';
    var m = 'mailto:' + template.destinatarios.join(',') + '?subject=' + encodeURIComponent(template.assunto(d)) + '&body=' + encodeURIComponent(corpo);
    var cc = template.cc(d).filter(Boolean);
    if (cc.length) m += '&cc=' + encodeURIComponent(cc.join(','));
    return m;
  }
  function webMailDe(d, tipo) {
    var r = resumoTexto(d);
    var para = template.destinatarios.join(','), cc = template.cc(d).filter(Boolean).join(','), su = template.assunto(d);
    var corpo = decodeURIComponent(mailtoDe(d).split('&body=')[1].split('&cc=')[0]);
    if (tipo === 'gmail')
      return 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(para) + '&cc=' + encodeURIComponent(cc) + '&su=' + encodeURIComponent(su) + '&body=' + encodeURIComponent(corpo);
    return 'https://outlook.office.com/mail/deeplink/compose?to=' + encodeURIComponent(para) + '&cc=' + encodeURIComponent(cc) + '&subject=' + encodeURIComponent(su) + '&body=' + encodeURIComponent(corpo);
  }

  form.onsubmit = function(ev) {
    ev.preventDefault();
    var d = coletar(), falta = [];
    if (!d.razaoSocial) falta.push('Razão Social');
    if (!d.codigo) falta.push('Código do cliente');
    if (!d.vendedor) falta.push('Vendedor');
    if (!d.supervisorNome) falta.push('Supervisor');
    if (!d.supervisorEmail) falta.push('E-mail do supervisor');
    if (!d.gestor) falta.push('Gestor');
    if (!d.autorizado) falta.push('Autorizado por');
    if (!d.itens.length) falta.push('pelo menos 1 item');
    else if (d.itens.some(function(it) { return !it.nome || !(it.qtd > 0) || !(it.kg > 0) || !(it.preco > 0); })) falta.push('nome, caixas, peso da caixa e preço por kg de cada item');
    if (!d.motivo) falta.push('Motivo da bonificação');
    if (falta.length) { window.alert('Preencha antes de gerar: ' + falta.join(', ')); return; }

    var blob = gerarPdfBonificacao(d), nome = nomeArquivo(d), mail = mailtoDe(d);
    baixar(blob, nome);
    var res = document.getElementById('bn_result');
    var podeCompartilhar = false;
    try { podeCompartilhar = !!(navigator.canShare && navigator.canShare({ files: [new File([blob], nome, { type: 'application/pdf' })] })); } catch (e) {}
    res.innerHTML = '<div class="bn-result">✅ <b>PDF gerado</b> (' + esc(nome) + ') e baixado.<br>' +
      '📎 O e-mail abre sozinho, mas <b>não anexa o PDF</b>: arraste o arquivo baixado para a mensagem (ou use o botão de compartilhar, no celular).' +
      '<br>📬 <b>Para:</b> ' + esc(template.destinatarios.join(', ')) + ' &nbsp;|&nbsp; <b>Cópia:</b> ' + esc(d.supervisorEmail) +
      '<div class="btns"><button type="button" class="btn btn-secondary" id="bn_b1">⬇️ Baixar PDF de novo</button>' +
      '<button type="button" class="btn btn-primary" id="bn_b2">✉️ Abrir e-mail</button>' +
      '<button type="button" class="btn btn-secondary" id="bn_b5">Abrir no Gmail</button>' +
      '<button type="button" class="btn btn-secondary" id="bn_b6">Abrir no Outlook</button>' +
      (podeCompartilhar ? '<button type="button" class="btn btn-secondary" id="bn_b4">📎 Compartilhar PDF</button>' : '') + '</div></div>';
    document.getElementById('bn_b1').onclick = function() { baixar(blob, nome); };
    document.getElementById('bn_b2').onclick = function() { window.location.href = mail; };
    document.getElementById('bn_b5').onclick = function() { window.open(webMailDe(d, 'gmail'), '_blank'); };
    document.getElementById('bn_b6').onclick = function() { window.open(webMailDe(d, 'outlook'), '_blank'); };
    if (podeCompartilhar) document.getElementById('bn_b4').onclick = function() {
      navigator.share({ files: [new File([blob], nome, { type: 'application/pdf' })], title: template.assunto(d), text: 'Solicitação de bonificação - ' + d.razaoSocial }).catch(function() {});
    };
    res.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    setTimeout(function() { window.location.href = mail; }, 900);
  };
}

function fecharModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

document.getElementById('modalOverlay').addEventListener('click', function(ev) {
  if (ev.target === this) fecharModal();
});

function toggleTheme() {
  var cur = document.documentElement.getAttribute('data-theme');
  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('estoque-theme', next);
  document.getElementById('themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
}

document.addEventListener('DOMContentLoaded', function() {
  var cur = document.documentElement.getAttribute('data-theme');
  document.getElementById('themeToggle').textContent = cur === 'dark' ? '☀️' : '🌙';
  montarGrid();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').catch(function() {});
  });
}
</script>
